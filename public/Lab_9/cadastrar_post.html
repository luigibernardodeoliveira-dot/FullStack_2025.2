<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastrar Post</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Novo Post</h1>
    <form action="/salvar_post" method="POST">
      <input type="text" name="titulo" placeholder="Título" required><br>
      <input type="text" name="resumo" placeholder="Resumo" required><br>
      <textarea name="conteudo" placeholder="Conteúdo do post" rows="6" required></textarea><br>
      <button type="submit">Publicar</button>
    </form>

    <a href="/blog" class="btn-voltar">⬅ Voltar ao Blog</a>
  </div>
</body>
</html>
