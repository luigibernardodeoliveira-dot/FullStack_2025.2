<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Novo Post</title>
  <link rel="stylesheet" href="/Lab_9/style.css">
</head>
<body>
  <div class="container">
    <h1>Criar novo post</h1>
    <form action="/cadastrar_post" method="POST">
      <input type="text" name="titulo" placeholder="Título do post" required>
      <textarea name="resumo" placeholder="Resumo curto do post"></textarea>
      <textarea name="conteudo" placeholder="Conteúdo completo" required></textarea>
      <button type="submit">Publicar</button>
    </form>

    <a href="/blog"><button>Ver Blog</button></a>
  </div>
</body>
</html>
